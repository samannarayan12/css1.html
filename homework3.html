<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us</title>
</head>
<body>
  <h1>Contact Us</h1>

  <p>We would love to hear from you. Please fill out the form below and we will get back to you soon.</p>

  <form action="#" method="post">
    <p>
      <label for="name">Full Name:</label><br>
      <input type="text" id="name" name="name" placeholder="Enter your full name" required maxlength="50">
    </p>

    <p>
      <label for="email">Email:</label><br>
      <input type="email" id="email" name="email" placeholder="example@email.com" required maxlength="100">
    </p>

    <p>
      <label for="phone">Phone Number:</label><br>
      <input type="tel" id="phone" name="phone" placeholder="(123) 456-7890" pattern="[0-9()\-\s+]+" maxlength="20">
    </p>

    <p>
      <label for="subject">Subject:</label><br>
      <input type="text" id="subject" name="subject" placeholder="How can we help?" required maxlength="100">
    </p>

    <p>
      <label for="message">Message:</label><br>
      <textarea id="message" name="message" rows="6" cols="50" placeholder="Write your message here..." required maxlength="500"></textarea>
    </p>

    <p>
      <input type="submit" value="Send Message">
      <input type="reset" value="Clear Form">
    </p>
  </form>

  <p>&copy; 2026 Green Valley Market</p>
</body>
</html>
